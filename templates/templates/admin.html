<!doctype html>
<html lang="kaa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin panel</title>
<style>
body{margin:0;background:#11151d;color:#fff;font-family:Arial}
.box{max-width:500px;margin:60px auto;padding:20px}
.card{background:#1b222d;border-radius:20px;padding:22px;margin:12px 0}
input,button{width:100%;padding:14px;border:0;border-radius:12px;margin-top:10px;font-size:16px}
input{background:#293241;color:#fff}
button{background:#2166d1;color:#fff;font-weight:bold}
a{color:#9cc3ff}
.stat{font-size:28px;font-weight:bold;margin-top:8px}
.muted{color:#9da7b6}
</style>
</head>
<body>
<div class="box">
<h1>🔐 Admin panel</h1>
{% if login %}
<div class="card">
<p>Admin parolin kiritiń.</p>
{% if error %}<p style="color:#ff7d87">{{error}}</p>{% endif %}
<form method="post">
<input type="password" name="password" placeholder="Parol" required>
<button>Kiriw</button>
</form>
</div>
{% else %}
<div class="card">
<div class="muted">🟢 Házir saytqa baylanıslı</div>
<div class="stat">{{ online }}</div>
</div>
<div class="card">
<div class="muted">👥 Jami paydalanıwshılar</div>
<div class="stat">{{ total }}</div>
</div>
<p><a href="/admin">🔄 Jańalaw</a></p>
<p><a href="/admin/logout">🚪 Shıǵıw</a></p>
{% endif %}
</div>
</body>
</html>
